<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .title{font:700 46px 'Helvetica Neue',Arial,sans-serif;fill:#0f172a}
      .sub{font:400 24px 'Helvetica Neue',Arial,sans-serif;fill:#475569}
      .cardnum{font:700 22px 'Helvetica Neue',Arial,sans-serif;fill:#ffffff}
      .cardtitle{font:700 25px 'Helvetica Neue',Arial,sans-serif;fill:#0f172a}
      .cardbody{font:400 19px 'Helvetica Neue',Arial,sans-serif;fill:#334155}
      .endlab{font:700 20px 'Helvetica Neue',Arial,sans-serif;letter-spacing:2px}
      .endsub{font:400 17px 'Helvetica Neue',Arial,sans-serif;fill:#64748b}
      .disc{font:italic 400 16px 'Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
    </style>
    <linearGradient id="specGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <marker id="aGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="60" y="84" class="title">Layer 3 Spectrum: AI as an Individual Contributor</text>
  <text x="60" y="124" class="sub">A gradient, not binary. It is a unit of work. Every point on this line counts.</text>

  <!-- Cards (lightest -> deepest, left to right) -->
  <!-- Card 1 -->
  <rect x="60" y="180" width="340" height="470" rx="16" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="2"/>
  <circle cx="100" cy="222" r="22" fill="#34d399"/>
  <text x="100" y="230" class="cardnum" text-anchor="middle">1</text>
  <text x="136" y="230" class="cardtitle">A skill</text>
  <text x="84" y="288" class="cardbody">A markdown file.</text>
  <text x="84" y="320" class="cardbody">Has an objective.</text>
  <text x="84" y="352" class="cardbody">Runs, then stops.</text>
  <text x="84" y="402" class="cardbody">Triggered by a human</text>
  <text x="84" y="430" class="cardbody">or by another agent.</text>
  <text x="84" y="492" class="cardbody">The lower bar to entry.</text>

  <!-- Card 2 -->
  <rect x="440" y="180" width="340" height="470" rx="16" fill="#dcfce7" stroke="#6ee7b7" stroke-width="2"/>
  <circle cx="480" cy="222" r="22" fill="#10b981"/>
  <text x="480" y="230" class="cardnum" text-anchor="middle">2</text>
  <text x="516" y="230" class="cardtitle">A shareable project</text>
  <text x="464" y="288" class="cardbody">A project others can</text>
  <text x="464" y="320" class="cardbody">pick up and use.</text>
  <text x="464" y="384" class="cardbody">Bundled context and</text>
  <text x="464" y="412" class="cardbody">instructions, reusable</text>
  <text x="464" y="440" class="cardbody">across the team.</text>

  <!-- Card 3 -->
  <rect x="820" y="180" width="340" height="470" rx="16" fill="#bbf7d0" stroke="#34d399" stroke-width="2"/>
  <circle cx="860" cy="222" r="22" fill="#059669"/>
  <text x="860" y="230" class="cardnum" text-anchor="middle">3</text>
  <text x="896" y="230" class="cardtitle">An acting agent</text>
  <text x="844" y="288" class="cardbody">Has the right tools</text>
  <text x="844" y="320" class="cardbody">and a memory.</text>
  <text x="844" y="384" class="cardbody">Takes real actions.</text>
  <text x="844" y="448" class="cardbody">Its actions are visible</text>
  <text x="844" y="476" class="cardbody">to humans and AI.</text>

  <!-- Card 4 -->
  <rect x="1200" y="180" width="340" height="470" rx="16" fill="#6ee7b7" stroke="#047857" stroke-width="2.5"/>
  <circle cx="1240" cy="222" r="22" fill="#047857"/>
  <text x="1240" y="230" class="cardnum" text-anchor="middle">4</text>
  <text x="1276" y="230" class="cardtitle">A portion of me</text>
  <text x="1224" y="284" class="cardbody">Goals of its own.</text>
  <text x="1224" y="316" class="cardbody">Episodic memory:</text>
  <text x="1224" y="344" class="cardbody">stores and retrieves.</text>
  <text x="1224" y="384" class="cardbody">Learns. Runs its own</text>
  <text x="1224" y="412" class="cardbody">retrospectives.</text>
  <text x="1224" y="452" class="cardbody">Accountable, reviewed,</text>
  <text x="1224" y="480" class="cardbody">self-improving.</text>
  <text x="1224" y="528" class="cardbody">Everything a human</text>
  <text x="1224" y="556" class="cardbody">IC has.</text>

  <!-- Spectrum bar -->
  <rect x="60" y="710" width="1480" height="26" rx="13" fill="url(#specGrad)"/>
  <line x1="60" y1="723" x2="1556" y2="723" stroke="#047857" stroke-width="0" marker-end="url(#aGreen)"/>
  <polygon points="1540,711 1568,723 1540,735" fill="#047857"/>

  <!-- End labels -->
  <text x="60" y="788" class="endlab" fill="#059669">SIMPLE</text>
  <text x="60" y="814" class="endsub">a unit of work, lower bar to entry</text>
  <text x="1540" y="788" class="endlab" fill="#047857" text-anchor="end">ADVANCED</text>
  <text x="1540" y="814" class="endsub" text-anchor="end">a trained part of a real role</text>

  <!-- Disclaimer -->
</svg>
