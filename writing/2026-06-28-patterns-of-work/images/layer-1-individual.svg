<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="80" y="108" font-size="44" font-weight="bold" fill="#0f172a">Layer 1 &#183; The Individual, Amplified</text>
  <text x="80" y="148" font-size="21" fill="#64748b">One person, IC or leader, running many loops at once.</text>

  <!-- Person node -->
  <circle cx="360" cy="430" r="72" fill="#0f172a"/>
  <!-- person glyph -->
  <circle cx="360" cy="408" r="20" fill="#ffffff"/>
  <path d="M 326 462 a 34 30 0 0 1 68 0 Z" fill="#ffffff"/>
  <text x="360" y="540" text-anchor="middle" font-size="21" fill="#334155">One person</text>

  <!-- Loop cycles radiating outward -->
  <!-- Loop 1 (top) -->
  <g>
    <line x1="424" y1="398" x2="640" y2="256" stroke="#94a3b8" stroke-width="2"/>
    <rect x="640" y="216" width="300" height="84" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="790" y="262" text-anchor="middle" font-size="20" fill="#334155">trigger &#8594; act &#8594; observe</text>
    <rect x="868" y="203" width="62" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="899" y="221" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">24/7</text>
  </g>

  <!-- Loop 2 -->
  <g>
    <line x1="432" y1="416" x2="640" y2="356" stroke="#94a3b8" stroke-width="2"/>
    <rect x="640" y="318" width="300" height="84" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="790" y="364" text-anchor="middle" font-size="20" fill="#334155">trigger &#8594; act &#8594; observe</text>
    <rect x="868" y="305" width="62" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="899" y="323" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">24/7</text>
  </g>

  <!-- Loop 3 -->
  <g>
    <line x1="432" y1="444" x2="640" y2="458" stroke="#94a3b8" stroke-width="2"/>
    <rect x="640" y="420" width="300" height="84" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="790" y="466" text-anchor="middle" font-size="20" fill="#334155">trigger &#8594; act &#8594; observe</text>
    <rect x="868" y="407" width="62" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="899" y="425" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">24/7</text>
  </g>

  <!-- Loop 4 -->
  <g>
    <line x1="428" y1="464" x2="640" y2="560" stroke="#94a3b8" stroke-width="2"/>
    <rect x="640" y="522" width="300" height="84" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="790" y="568" text-anchor="middle" font-size="20" fill="#334155">trigger &#8594; act &#8594; observe</text>
    <rect x="868" y="509" width="62" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="899" y="527" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">24/7</text>
  </g>

  <!-- Loop 5 (bottom) -->
  <g>
    <line x1="416" y1="478" x2="640" y2="662" stroke="#94a3b8" stroke-width="2"/>
    <rect x="640" y="624" width="300" height="84" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="790" y="670" text-anchor="middle" font-size="20" fill="#334155">trigger &#8594; act &#8594; observe</text>
    <rect x="868" y="611" width="62" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="899" y="629" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">24/7</text>
  </g>

  <text x="360" y="616" text-anchor="middle" font-size="17" fill="#64748b">many loops in parallel</text>

  <!-- Green callout box (real receipt) -->
  <rect x="1000" y="216" width="520" height="196" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="1024" y="262" font-size="17" font-weight="bold" fill="#047857">REAL RECEIPT</text>
  <text x="1024" y="306" font-size="21" fill="#334155">continuous-agent: a 24/7 autonomous</text>
  <text x="1024" y="340" font-size="21" fill="#334155">coding agent, built in the open.</text>
  <text x="1024" y="382" font-size="21" fill="#334155">Demoed live at AI Tinkerers Columbus.</text>

  <!-- Contrast band near bottom -->
  <rect x="80" y="724" width="710" height="86" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="435" y="762" text-anchor="middle" font-size="21" fill="#334155">Starting loops is easy.</text>
  <text x="435" y="792" text-anchor="middle" font-size="21" fill="#64748b">The party trick.</text>

  <rect x="810" y="724" width="710" height="86" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1165" y="762" text-anchor="middle" font-size="21" fill="#b45309">Working the same agent over time, managing</text>
  <text x="1165" y="792" text-anchor="middle" font-size="21" font-weight="bold" fill="#b45309">and versioning its output, is the actual skill.</text>

  <!-- Bottom note in accent -->
  <text x="1000" y="468" font-size="21" font-weight="bold" fill="#059669">Invest in level of output (volume + quality),</text>
  <text x="1000" y="500" font-size="21" font-weight="bold" fill="#059669">not just speed.</text>

  <!-- Disclaimer -->
</svg>
