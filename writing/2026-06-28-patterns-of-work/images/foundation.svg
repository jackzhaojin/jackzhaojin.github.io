<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="80" y="92" font-size="44" font-weight="bold" fill="#0f172a">The Foundation &#183; Shared Context Services</text>
  <text x="80" y="128" font-size="21" fill="#64748b">The SharePoint and Teams of the AI era.</text>

  <!-- ============ TOP BAND: Humans (blue) ============ -->
  <rect x="80" y="170" width="1440" height="104" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="110" y="216" font-size="28" font-weight="bold" fill="#2563eb">Humans</text>
  <text x="110" y="248" font-size="20" fill="#334155">people doing the work, looking for context as they go</text>

  <!-- Two-way arrows: Humans to/from store (down = write, up = read) -->
  <g>
    <line x1="500" y1="274" x2="500" y2="356" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
    <line x1="560" y1="356" x2="560" y2="278" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
    <line x1="1040" y1="274" x2="1040" y2="356" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
    <line x1="1100" y1="356" x2="1100" y2="278" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
  </g>
  <text x="470" y="324" font-size="17" fill="#2563eb" text-anchor="end" font-weight="bold">write</text>
  <text x="590" y="324" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">read</text>
  <text x="1010" y="324" font-size="17" fill="#2563eb" text-anchor="end" font-weight="bold">write</text>
  <text x="1130" y="324" font-size="17" fill="#2563eb" text-anchor="start" font-weight="bold">read</text>

  <!-- ============ MIDDLE BAND: the shared store (prominent, slate) ============ -->
  <rect x="80" y="364" width="1440" height="146" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/>
  <text x="800" y="420" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">One shared context store</text>
  <text x="800" y="456" font-size="21" fill="#e2e8f0" text-anchor="middle">specialized rules &amp; task-close info, within reach</text>
  <rect x="558" y="474" width="190" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="653" y="492" font-size="15" font-weight="bold" fill="#e2e8f0" text-anchor="middle">find context</text>
  <rect x="762" y="474" width="280" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="902" y="492" font-size="15" font-weight="bold" fill="#e2e8f0" text-anchor="middle">contribute back, usefully</text>

  <!-- Two-way arrows: Agents to/from store (up = write, down = read) -->
  <g>
    <line x1="500" y1="600" x2="500" y2="518" stroke="#047857" stroke-width="3" marker-end="url(#arrGreen)"/>
    <line x1="560" y1="518" x2="560" y2="596" stroke="#047857" stroke-width="3" marker-end="url(#arrGreen)"/>
    <line x1="1040" y1="600" x2="1040" y2="518" stroke="#047857" stroke-width="3" marker-end="url(#arrGreen)"/>
    <line x1="1100" y1="518" x2="1100" y2="596" stroke="#047857" stroke-width="3" marker-end="url(#arrGreen)"/>
  </g>
  <text x="470" y="566" font-size="17" fill="#047857" text-anchor="end" font-weight="bold">write</text>
  <text x="590" y="566" font-size="17" fill="#047857" text-anchor="start" font-weight="bold">read</text>
  <text x="1010" y="566" font-size="17" fill="#047857" text-anchor="end" font-weight="bold">write</text>
  <text x="1130" y="566" font-size="17" fill="#047857" text-anchor="start" font-weight="bold">read</text>

  <!-- ============ BOTTOM BAND: Agents (green) ============ -->
  <rect x="80" y="600" width="1440" height="104" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2.5"/>
  <text x="110" y="646" font-size="28" font-weight="bold" fill="#047857">Agents</text>
  <text x="110" y="678" font-size="20" fill="#334155">models doing the work, pulling and pushing the same context</text>

  <!-- Key requirement line -->
  <text x="800" y="742" font-size="21" font-weight="bold" fill="#0d9488" text-anchor="middle">Two-way. Find context AND contribute back, usefully to humans and AI.</text>

  <!-- ============ Before / After note ============ -->
  <line x1="800" y1="766" x2="800" y2="816" stroke="#e2e8f0" stroke-width="2"/>
  <text x="120" y="784" font-size="17" font-weight="bold" fill="#64748b">Before AI</text>
  <text x="120" y="810" font-size="17" fill="#64748b">Teams + SharePoint, so people could find context.</text>
  <text x="830" y="784" font-size="17" font-weight="bold" fill="#047857">Now</text>
  <text x="830" y="810" font-size="17" fill="#047857">the same thing, for people AND agents.</text>

  <!-- Footer line -->
  <text x="80" y="844" font-size="17" fill="#334155">Make this AI-friendly and human-friendly at once, and the Layer 5 merge stops being so hard.</text>

  <!-- Disclaimer -->
</svg>
