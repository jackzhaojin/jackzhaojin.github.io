<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2120" width="1400" height="2120" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .t-title{font:700 44px 'Helvetica Neue',Arial,sans-serif;fill:#0f172a}
      .t-sub{font:400 21px 'Helvetica Neue',Arial,sans-serif;fill:#475569}
      .l-title{font:700 30px 'Helvetica Neue',Arial,sans-serif;fill:#0f172a}
      .l-body{font:400 21px 'Helvetica Neue',Arial,sans-serif;fill:#334155}
      .l-accent{font:600 21px 'Helvetica Neue',Arial,sans-serif;fill:#047857}
      .l-muted{font:italic 400 19px 'Helvetica Neue',Arial,sans-serif;fill:#64748b}
      .badge{font:700 26px 'Helvetica Neue',Arial,sans-serif;fill:#ffffff}
      .boxlab{font:700 24px 'Helvetica Neue',Arial,sans-serif}
      .boxsub{font:400 17px 'Helvetica Neue',Arial,sans-serif}
      .pill{font:700 15px 'Helvetica Neue',Arial,sans-serif}
      .pill-sm{font:700 14px 'Helvetica Neue',Arial,sans-serif}
      .p-head{font:700 18px 'Helvetica Neue',Arial,sans-serif;fill:#047857}
      .p-a{font:400 18px 'Helvetica Neue',Arial,sans-serif;fill:#334155}
      .p-b{font:400 16px 'Helvetica Neue',Arial,sans-serif;fill:#334155}
      .p-bf{font:600 16px 'Helvetica Neue',Arial,sans-serif;fill:#047857}
      .grad-head{font:700 17px 'Helvetica Neue',Arial,sans-serif;fill:#047857}
      .grad-body{font:400 17px 'Helvetica Neue',Arial,sans-serif;fill:#334155}
      .risk-title{font:700 23px 'Helvetica Neue',Arial,sans-serif;fill:#b91c1c}
      .risk-body{font:400 19px 'Helvetica Neue',Arial,sans-serif;fill:#7f1d1d}
      .spine-main{font:700 27px 'Helvetica Neue',Arial,sans-serif;fill:#b45309;letter-spacing:3px}
      .spine-sub{font:400 16px 'Helvetica Neue',Arial,sans-serif;fill:#92400e}
      .spine-head{font:700 16px 'Helvetica Neue',Arial,sans-serif;fill:#b45309;letter-spacing:2px}
      .climb{font:700 18px 'Helvetica Neue',Arial,sans-serif;fill:#0d9488;letter-spacing:2px}
      .merge{font:italic 400 16px 'Helvetica Neue',Arial,sans-serif;fill:#64748b}
      .learn{font:italic 400 15px 'Helvetica Neue',Arial,sans-serif;fill:#92400e}
      .foot{font:600 22px 'Helvetica Neue',Arial,sans-serif;fill:#ffffff}
      .found-title{font:700 26px 'Helvetica Neue',Arial,sans-serif;fill:#0f172a}
      .found-sub{font:400 18px 'Helvetica Neue',Arial,sans-serif;fill:#334155}
      .disc{font:italic 400 15px 'Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
    </style>
    <linearGradient id="mergeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="climbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="l3grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="2120" fill="#ffffff"/>

  <!-- Title -->
  <text x="180" y="92" class="t-title">Patterns of Work</text>
  <text x="180" y="128" class="t-sub">How AI ways of working scale: from one person, IC or leader, to a human + agent mesh</text>
  <line x1="180" y1="150" x2="1324" y2="150" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Left progression arrow (top to bottom) -->
  <line x1="100" y1="186" x2="100" y2="1834" stroke="url(#climbGrad)" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <text x="56" y="1010" class="climb" text-anchor="middle" transform="rotate(-90,56,1010)">INDIVIDUAL  &#8594;  ORGANIZATION</text>

  <!-- Right spine -->
  <rect x="1196" y="180" width="128" height="1654" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1260" y="214" class="spine-head" text-anchor="middle">THE SPINE</text>
  <text x="1248" y="1010" class="spine-main" text-anchor="middle" transform="rotate(-90,1248,1010)">CONTEXT &#183; GOVERNANCE &#183; OBSERVABILITY &#183; EVALS</text>
  <text x="1292" y="1010" class="spine-sub" text-anchor="middle" transform="rotate(-90,1292,1010)">humans and agents watch and evaluate the whole system</text>

  <!-- L1 IC (top) -->
  <rect x="180" y="180" width="980" height="200" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="230" cy="218" r="28" fill="#0f172a"/>
  <text x="230" y="227" class="badge" text-anchor="middle">1</text>
  <text x="280" y="228" class="l-title">Individuals: IC + Leaders</text>
  <rect x="775" y="205" width="130" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="840" y="225" class="pill" text-anchor="middle" fill="#b45309">START HERE</text>
  <text x="280" y="268" class="l-body">24/7 agents &#183; loops + harnesses &#183; one person now runs many loops</text>
  <text x="280" y="304" class="l-body">The hard part: work the same agent, then manage and version its output</text>
  <text x="280" y="340" class="l-muted">A year exploring this with peers, from AI-curious to AI-fearful</text>

  <!-- L2 TEAM -->
  <rect x="180" y="404" width="980" height="240" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="230" cy="442" r="28" fill="#0f172a"/>
  <text x="230" y="451" class="badge" text-anchor="middle">2</text>
  <text x="280" y="452" class="l-title">Team</text>
  <rect x="775" y="429" width="210" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="880" y="449" class="pill-sm" text-anchor="middle" fill="#b45309">HARDER THAN IT LOOKS</text>
  <text x="280" y="492" class="l-body">AI-enabled teammates share context, not just results</text>
  <text x="280" y="528" class="l-accent">Both matter: the formulation (inputs we feed agents) and the output</text>
  <text x="280" y="564" class="l-body">Relevant project context, available to each other, cuts meetings</text>
  <text x="280" y="600" class="l-accent">AI pre-aligns on the why / what / how before we meet, or even schedules it</text>

  <!-- L3 AI AS IC (breakthrough, centerpiece) -->
  <rect x="180" y="668" width="980" height="480" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <circle cx="230" cy="706" r="28" fill="#047857"/>
  <text x="230" y="715" class="badge" text-anchor="middle">3</text>
  <text x="280" y="716" class="l-title">AI as an Individual Contributor</text>
  <rect x="980" y="693" width="150" height="30" rx="15" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1055" y="713" class="pill" text-anchor="middle" fill="#047857">BREAKTHROUGH</text>
  <text x="210" y="756" class="l-body">A real, accountable contributor that owns its work. Started by a human or AI.</text>

  <rect x="200" y="786" width="450" height="210" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="222" y="818" class="p-head">Equipped to act</text>
  <text x="222" y="858" class="p-a">&#183; Right context in</text>
  <text x="222" y="904" class="p-a">&#183; The right tools, and able to take actions</text>
  <text x="222" y="950" class="p-a">&#183; Its actions visible to humans and AI</text>

  <rect x="690" y="786" width="450" height="210" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="712" y="818" class="p-head">Accountable, and gets better</text>
  <text x="712" y="850" class="p-b">&#183; Owns its work. Reviewable, upgradable.</text>
  <text x="712" y="880" class="p-b">&#183; Memory: stores and retrieves episodic</text>
  <text x="712" y="910" class="p-b">&#183; Performance reviews. Self-improving.</text>
  <text x="712" y="940" class="p-bf">&#183; Feedback (good + bad, start positive)</text>
  <text x="712" y="970" class="p-bf">&#183; from anyone who uses it, even other AI, agentically</text>

  <!-- L3 gradient bar -->
  <rect x="200" y="1014" width="940" height="66" rx="10" fill="url(#l3grad)" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="1042" class="grad-head" text-anchor="middle">A gradient, not binary. It is a unit of work</text>
  <text x="670" y="1066" class="grad-body" text-anchor="middle">a markdown file with an objective that stops  &#8594;  an agent trained on part of your role</text>

  <text x="210" y="1116" class="l-accent">Beats forcing business users to install skills to get value.</text>

  <!-- The point: agents alongside humans on a shared surface -->
  <rect x="180" y="1168" width="980" height="86" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="1010" y="1180" width="130" height="28" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1075" y="1199" class="pill-sm" text-anchor="middle" fill="#047857">THE POINT</text>
  <text x="204" y="1206" style="font:700 23px 'Helvetica Neue',Arial,sans-serif;fill:#065f46">Not data readiness. Agents working alongside us, on a shared surface.</text>
  <text x="204" y="1238" style="font:400 19px 'Helvetica Neue',Arial,sans-serif;fill:#334155">With real trust, security, observability, and governance underneath.</text>

  <!-- L4 SILOED -->
  <rect x="180" y="1278" width="980" height="210" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="230" cy="1316" r="28" fill="#0f172a"/>
  <text x="230" y="1325" class="badge" text-anchor="middle">4</text>
  <text x="280" y="1326" class="l-title">Management: Siloed</text>
  <text x="280" y="1360" class="l-body">Accelerated work, change mgmt + BPM, evals. Two separate tracks.</text>
  <rect x="200" y="1374" width="440" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="1412" class="boxlab" text-anchor="middle" fill="#1e3a8a">Humans manage humans</text>
  <text x="420" y="1440" class="boxsub" text-anchor="middle" fill="#1e40af">human track</text>
  <rect x="700" y="1374" width="440" height="88" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="920" y="1412" class="boxlab" text-anchor="middle" fill="#115e59">AI manages AI</text>
  <text x="920" y="1440" class="boxsub" text-anchor="middle" fill="#0f766e">agent track</text>
  <line x1="670" y1="1378" x2="670" y2="1458" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- merge zone (silos converge downward) + the learning -->
  <line x1="590" y1="1496" x2="705" y2="1532" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="850" y1="1496" x2="735" y2="1532" stroke="#0d9488" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <text x="868" y="1522" class="merge" text-anchor="start">silos merge</text>
  <rect x="300" y="1540" width="760" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="680" y="1564" class="learn" text-anchor="middle">The learning: AI-to-AI is easy, given AI-friendly interfaces, context, and storage.</text>
  <text x="680" y="1586" class="learn" text-anchor="middle">AI + humans together is the hard part. Many human interfaces aren't AI-friendly.</text>

  <!-- L5 MERGED (payoff) -->
  <rect x="180" y="1608" width="980" height="230" rx="16" fill="url(#mergeGrad)" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="230" cy="1646" r="28" fill="#0f172a"/>
  <text x="230" y="1655" class="badge" text-anchor="middle">5</text>
  <text x="280" y="1656" class="l-title">Management: Merged</text>
  <rect x="775" y="1633" width="130" height="30" rx="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="840" y="1653" class="pill" text-anchor="middle" fill="#475569">THE PAYOFF</text>
  <text x="280" y="1696" class="l-body">Human managers and agentic managers share one common context</text>
  <text x="280" y="1732" class="l-body">Silos dissolve into a single mesh</text>
  <text x="280" y="1768" class="l-accent">Leadership augmented, even its own feedback loop</text>
  <text x="280" y="1804" class="l-body">&#8594; an agentic delivery vehicle managing agents and human output</text>

  <!-- Foundation: shared context services -->
  <rect x="160" y="1862" width="1020" height="92" rx="16" fill="url(#mergeGrad)" stroke="#475569" stroke-width="2.5"/>
  <text x="210" y="1904" class="found-title">Shared Context Services</text>
  <rect x="812" y="1878" width="348" height="28" rx="14" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="986" y="1897" class="pill-sm" text-anchor="middle" fill="#475569">THE SHAREPOINT &amp; TEAMS OF THE AI ERA</text>
  <text x="210" y="1936" class="found-sub">Where humans and agents both find the context they need, and contribute it back.</text>

  <!-- Footer takeaway -->
  <rect x="100" y="1982" width="1224" height="58" rx="14" fill="#0f172a"/>
  <text x="712" y="2019" class="foot" text-anchor="middle">The engineer's new craft: designing the layer where humans and agents work as one.</text>

  <!-- Disclaimer -->
</svg>
