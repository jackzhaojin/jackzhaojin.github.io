<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="700" fill="#ffffff"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2328">Postal Portal — one spec method, two stacks</text>
  <text x="40" y="70" font-size="13" fill="#57606a">July 2025. Both halves were written down before they were built. Reconstructed from the two repos' commit history.</text>

  <!-- ==================== THE WRITTEN LAYER (top center) ==================== -->
  <rect x="340" y="100" width="600" height="150" rx="14" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
  <text x="360" y="130" font-size="16" font-weight="700" fill="#7d4e00">The written layer  <tspan font-weight="400" font-size="12" fill="#9a6700">(specs before code)</tspan></text>
  <text x="360" y="156" font-size="12.5" fill="#5c4400">PRD.md · TECHNICAL_SPEC.md — for the marketing site</text>
  <text x="360" y="178" font-size="12.5" fill="#5c4400">A numbered task list, 1.x → 9.x — for the transactional flow</text>
  <text x="360" y="212" font-size="11.5" fill="#9a6700" font-style="italic">Referenced in the READMEs but kept local, never committed.</text>
  <text x="360" y="229" font-size="11.5" fill="#9a6700" font-style="italic">Git under-counts the planning half of this build.</text>

  <!-- arrows to the two stacks -->
  <path d="M 520 250 L 360 296" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 760 250 L 920 296" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ==================== MARKETING SITE (left) ==================== -->
  <rect x="40" y="300" width="580" height="290" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="60" y="330" font-size="16" font-weight="700" fill="#0550ae">da-live-postal-2025-07  <tspan font-weight="400" font-size="12" fill="#4a7db5">(EDS + da.live)</tspan></text>
  <text x="60" y="352" font-size="12.5" fill="#33506b">The marketing site, authored as content in da.live.</text>

  <rect x="60" y="370" width="540" height="132" rx="9" fill="#ffffff" stroke="#a3cef1" stroke-width="1.1"/>
  <text x="76" y="394" font-size="12" fill="#3f4660">17+ reusable authoring blocks: hero · cards · stats · forms · tabs …</text>
  <text x="76" y="416" font-size="12" fill="#3f4660">Page content lives in da.live, not in git</text>
  <text x="76" y="438" font-size="12" fill="#3f4660">Build week Jul 12 → 19 landed as one 2,700+ line commit</text>
  <text x="76" y="460" font-size="12" fill="#3f4660">Small restyles kept landing through May 2026</text>
  <text x="76" y="488" font-size="11.5" fill="#57606a" font-style="italic">10 commits total; the week of work is nearly invisible in the log</text>

  <text x="60" y="560" font-size="12" fill="#0969da" font-style="italic">The half git under-counts the most.</text>

  <!-- ==================== TRANSACTIONAL FLOW (right) ==================== -->
  <rect x="660" y="300" width="580" height="290" rx="14" fill="#e9f5ee" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="680" y="330" font-size="16" font-weight="700" fill="#116329">nextjs-postal-2025-07  <tspan font-weight="400" font-size="12" fill="#4c8f63">(Next.js + TypeScript)</tspan></text>
  <text x="680" y="352" font-size="12.5" fill="#2f4a3a">The transactional flow: quote → pickup → review → confirmation.</text>

  <rect x="680" y="370" width="540" height="132" rx="9" fill="#ffffff" stroke="#a9d6bb" stroke-width="1.1"/>
  <text x="696" y="394" font-size="12" fill="#3f4660">89 commits in six days, Jul 19 → 25</text>
  <text x="696" y="416" font-size="12" fill="#3f4660">Commits numbered against the task list: 1.2 → 9.3</text>
  <text x="696" y="438" font-size="12" fill="#3f4660">Playwright tests per task; release branches 0.4.4 → 0.9.3</text>
  <text x="696" y="460" font-size="12" fill="#3f4660">The commit log doubles as the sprint report</text>
  <text x="696" y="488" font-size="11.5" fill="#57606a" font-style="italic">Ends Jul 25 with an end-to-end pickup flow validation pass</text>

  <text x="680" y="560" font-size="12" fill="#1a7f37" font-style="italic">The half where the method is visible in git.</text>

  <!-- ==================== THE LOOP (bottom) ==================== -->
  <rect x="40" y="616" width="1200" height="52" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.1"/>
  <text x="640" y="647" font-size="12.5" fill="#57606a" text-anchor="middle"><tspan font-weight="700" fill="#1f2328">The loop, per task:</tspan>  read the numbered task → build → test → commit under the task number → next task</text>
</svg>
